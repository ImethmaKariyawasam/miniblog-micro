spring.application.name=comment-service

server.port=8083

spring.datasource.url=jdbc:h2:mem:commentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=miniblog-super-secret-signing-key-for-jwt-learning-project-2026

post-service.base-url=http://host.docker.internal:8082
